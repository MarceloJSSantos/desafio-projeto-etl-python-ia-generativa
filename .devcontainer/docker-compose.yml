name: Desafio Projeto ETL Python com IA Generativa
version: "3.8"

services:
  app:
    container_name: pipeline-etl-python-com-ia-generativa
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace
    ports:
      - "8082:8082"
    command: bash -c "luigid --port 8082 & sleep infinity"
